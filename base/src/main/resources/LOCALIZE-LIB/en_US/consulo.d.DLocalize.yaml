d.inspections.description.fishoperators:
    text: Avoid using the deprecated floating-point operators.
d.inspections.description.functionshouldbeconst:
    text: '"opCmp" or "opEquals", or "toHash" should be declared "const"'
d.inspections.description.implicitlyconcatenatedstrings:
    text: <p>This inspection warns of strings that are implicitly concatenated without the use of a "~"</p>
