d.inspections.description.builtinpropertyname:
    text: |-
        The following code is an example of what not to do (taken from a DScanner comment):
        <pre><code>
        class SomeClass &#123;
            void init();
            int init;
            string mangleof = "LOL";
            auto init = 10;
            enum sizeof = 10;
        &#125;
        </code></pre>
d.inspections.description.deleteisdeprecated:
    text: Avoid using the 'delete' keyword. It is deprecated
d.inspections.description.deletestatementsaredeprecated:
    text: Delete statements are deprecated and should not be used
d.inspections.description.deprecated128bitintegertype:
    text: |-
        D currently reserves the <b>cent</b> and <b>ucent</b> keywords for future use as 128-bit integral types. Using them will result in a compile-time error.
        <p>
            Use the library types in <b>std.int128</b> or <b>core.int128</b> instead
        </p>
        <p>
            See <a href="https://dlang.org/deprecate.html#128-bit%20integer%20types">128-bit integer types</a> for more information.
        </p>
        <pre><code>
        cent a = 18446744073709551616L;
        ucent b = 36893488147419103232UL;
        </code></pre>
d.inspections.description.deprecatedphobosimport:
    text: Use of deprecated phobos package detected
d.inspections.description.emptystatement:
    text: Empty statement, e.g an extraneous semicolon.
d.inspections.description.enumarrayliteralsinclassdeclaration:
